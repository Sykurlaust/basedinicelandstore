<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart — basediniceland</title>
  <link href="./output.css" rel="stylesheet" />
</head>
<body class="min-h-screen bg-black overflow-x-hidden overscroll-none">
  <!-- glacier bg -->
  <div class="fixed inset-0 -z-10 bg-cover bg-center bg-no-repeat"
       style="background-image: url('./images/baraglacier.jpg');"></div>

  <!-- page wrapper -->
  <div class="min-h-screen relative flex flex-col">
    <!-- (optional) nav: keep your existing navbar here if you want -->

    <main class="flex-1 pt-20 md:pt-28 pb-16 px-4 md:px-6">
      <section class="w-full max-w-7xl mx-auto">
        <h1 class="text-3xl md:text-4xl lg:text-5xl font-extrabold tracking-tight text-white text-center">
          Shopping Cart
        </h1>

        <!-- glass container -->
        <div
          class="mt-8 rounded-3xl p-4 md:p-6 lg:p-8
                 bg-gradient-to-br from-white/18 via-white/12 to-white/10
                 backdrop-blur-2xl backdrop-saturate-150
                 border border-white/40 ring-1 ring-white/25
                 shadow-[0_12px_45px_rgba(0,0,0,0.35)]">

          <!-- Cart line items get rendered here -->
          <div id="cart-list" class="space-y-6"></div>

          <!-- Subtotal / actions -->
          <div class="mt-8 border-t border-white/20 pt-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div class="flex items-center gap-6 text-white/90">
              <div><span class="opacity-80 mr-2">Items:</span><span id="cart-items-count">0</span></div>
              <div><span class="opacity-80 mr-2">Subtotal:</span><span id="cart-total">ISK 0</span></div>
            </div>

            <div class="flex gap-3">
              <button id="btn-clear"
                class="px-4 py-2.5 rounded-full bg-white/15 text-white hover:bg-white/25 transition">
                Clear
              </button>
              <button
                class="px-6 py-2.5 rounded-full bg-white/90 text-slate-900 font-semibold hover:bg-white transition">
                Checkout
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="./js/cart.js"></script>
</body>
</html>
